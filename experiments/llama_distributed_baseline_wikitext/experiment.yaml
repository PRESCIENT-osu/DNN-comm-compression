name: llama_distributed_baseline_wikitext
model: llama-3.1-8b
baseline: distributed_no_compression

nodes:
  - name: early
    host: llama-early
    port: 8000
    partitions: [p1]
  - name: middle
    host: llama-middle
    port: 8001
    partitions: [p2]
  - name: late
    host: llama-late
    port: 8002
    partitions: [p3]

links:
  - from: early
    to: middle
    compression: none
  - from: middle
    to: late
    compression: none

sweep: []

dataset:
  name: wikitext2
  path: /partitions/tokenizer
  tokenizer_path: /partitions/tokenizer
  batch_size: 2
  max_in_flight: 2
  max_seq_len: 512

metrics_server:
  host: metrics
  port: 9100
