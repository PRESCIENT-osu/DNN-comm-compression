name: llama_topk_wikitext
model: llama-3.1-8b
baselines:
  - llama_single_node_baseline_wikitext
  - llama_distributed_baseline_wikitext

nodes:
  - name: early
    host: llama-early
    port: 8000
    partitions: [p1]
  - name: middle
    host: llama-middle
    port: 8001
    partitions: [p2]
  - name: late
    host: llama-late
    port: 8002
    partitions: [p3]

links:
  - from: early
    to: middle
    compression: none
  - from: middle
    to: late
    compression: none

sweep_mode: paired
sweep:
  - links:
      - from: early
        to: middle
        compression: none
      - from: middle
        to: late
        compression: none
  - links:
      - from: early
        to: middle
        compression: topk
        rates: [0.1, 0.3, 0.5, 0.7]
      - from: middle
        to: late
        compression: topk
        rates: [0.1, 0.3, 0.5, 0.7]

dataset:
  name: wikitext2
  path: /partitions/tokenizer
  tokenizer_path: /partitions/tokenizer
  batch_size: 2
  max_in_flight: 2
  max_seq_len: 512

metrics_server:
  host: metrics
  port: 9100
