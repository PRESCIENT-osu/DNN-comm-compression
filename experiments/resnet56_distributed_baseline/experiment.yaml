experiment:
  name: resnet56_distributed_baseline
  model: resnet56
  baseline: distributed_no_compression

  nodes:
    - name: A
      host: node-a
      port: 8000
      partitions: [p1]
    - name: B
      host: node-b
      port: 8001
      partitions: [p2, p3]
    - name: C
      host: node-c
      port: 8002
      partitions: [p4, p5]

  links:
    - from: A
      to: B
      compression: none
    - from: B
      to: C
      compression: none

  sweep: []

  dataset:
    name: cifar10
    path: .datasets/cifar10
    batch_size: 100
    max_in_flight: 10

  metrics_server:
    host: metrics
    port: 9100
