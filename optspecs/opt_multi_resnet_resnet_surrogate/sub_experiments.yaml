# Optimization sub-experiments for ResNet56 + Llama-MMLU.
#
# Executed sequentially in order.  Each type builds on the artifacts of
# previous phases: profiling → accuracy_model → optimization loops.
#
# channel_estimator.experiment_name_contains is intentionally omitted here;
# tools/generate.py --opt injects it automatically from the profile filename
# stem (e.g. "100mbps") so probe history is scoped to the correct hardware
# profile without modifying InfraConfig or any previously collected events.

sub_experiments:

  # -----------------------------------------------------------------------
  # Phase 1: Profiling
  # Runs profiling_batches inference rounds at η=1.0 on all links.
  # Measures per-node compute latency (τ_i) and activation tensor sizes (a_i).
  # Artifacts are reused by all subsequent sub-experiments.
  # -----------------------------------------------------------------------
  - name: profiling
    type: profiling

  # -----------------------------------------------------------------------
  # Phase 2: Accuracy model training
  # Trains a surrogate A_k(η) for each pipeline via simulation-based sweep.
  # Uses a separate dataset slice (different seed) from the main inference
  # tasks to prevent data leakage.
  # -----------------------------------------------------------------------
  - name: accuracy_model_resnet-a
    type: accuracy_model
    pipeline_id: resnet-a
    model_type: gbm
    sweep_design: random
    n_sweep_samples: 40
    dataset:
      name: cifar10
      path: .datasets/cifar10
      batch_size: 25
      max_samples: 10
      seed: 100

  - name: accuracy_model_resnet-b
    type: accuracy_model
    pipeline_id: resnet-b
    model_type: gbm
    sweep_design: random
    n_sweep_samples: 40
    dataset:
      name: cifar10
      path: .datasets/cifar10
      batch_size: 25
      max_samples: 10
      seed: 101

  # -----------------------------------------------------------------------
  # Phase 3: No-CSI optimizer sweep over μ values
  # Each μ in mu_sweep produces one independent optimization run.
  # Uses the surrogate models trained above for both pipelines.
  # -----------------------------------------------------------------------
  - name: no_csi_mu_sweep
    type: no_csi
    mu_sweep: [0.5, 4.0, 10.0]
    accuracy_model_refs:
      - accuracy_model_resnet-a
      - accuracy_model_resnet-b
    bcd_iterations: 5  # BCD iterations J per slot (multi-task only; ignored for single-task)
    channel_estimator:
      type: moving_average
      window_size: 10
      history_source: metrics_server
      # experiment_name_contains: injected by generator (e.g. "100mbps")
      warmup_value_bps: 1.0e8

  # -----------------------------------------------------------------------
  # Phase 4: CSI-aware optimizer (closed-form η*)
  # Uses LCB estimator for conservative channel capacity estimate.
  # -----------------------------------------------------------------------
  - name: csi_aware
    type: csi_aware


  # -----------------------------------------------------------------------
  # Phase 5: Multi-task baselines
  # -----------------------------------------------------------------------
  - name: max_compression_multi
    type: max_compression_multi

  - name: no_compression_multi
    type: no_compression_multi

  - name: static_equal_share
    type: static_equal_share

  - name: proportional_resource
    type: proportional_resource

  - name: strict_priority_greedy
    type: strict_priority_greedy

  - name: decoupled_descent
    type: decoupled_descent
    mu: 1.0
    epsilon: 0.1
    channel_estimator:
      type: moving_average
      window_size: 10
      warmup_value_bps: 1.0e8

  - name: queue_proportional
    type: queue_proportional
    mu: 1.0
    epsilon: 0.1
    channel_estimator:
      type: moving_average
      window_size: 10
      warmup_value_bps: 1.0e8

  - name: historical_average_ce
    type: historical_average_ce
    channel_estimator:
      type: mean
      warmup_value_bps: 1.0e8
