# Optimization experiment spec: ResNet56 + Llama-MMLU on a 3-node linear topology.
#
# Paired with a profile (e.g. profiles/linear-3-multi/100mbps.yaml) by
# tools/generate.py --opt to produce a fully resolved experiment in
# experiments/opt/<name>/.

nodes:
  - A
  - B
  - C

pipelines:
  - name: resnet-a
    model: resnet
    partitions:
      A: [p1]
      B: [p2, p3]
      C: [p4, p5]
    flow: [A, B, C]
    simulation_path: models/resnet/resnet56-4bfd9763.th

  - name: resnet-b
    model: resnet
    partitions:
      A: [p1]
      B: [p2, p3]
      C: [p4, p5]
    flow: [A, B, C]
    simulation_path: models/resnet/resnet56-4bfd9763.th

datasets:
  resnet:
    name: cifar10
    path: .datasets/cifar10
    batch_size: 100
    max_in_flight: 4
    max_samples: 10
    seed: 42

workload:
  pattern: fill
  window_per_pipeline: 4
  mix:
    resnet-a: 0.5
    resnet-b: 0.5

# Per-pipeline throughput targets (R_k) and WFQ compute share weights (s_comp).
tasks:
  resnet-a:
    throughput_target: 5.0   # tasks/second
    task_weight: 0.4         # proportional WFQ weight
  resnet-b:
    throughput_target: 5.0   # tasks/second
    task_weight: 0.4 

# Per-link optimization search space.  The optimizer selects η ∈ [eta_min, eta_max]
# from the allowed_methods each slot.
links:
  - from: A
    to: B
    eta_min: 0.01
    eta_max: 1.0
    allowed_methods: [topk]
    llmint8_mapping:
      resnet-a:
        outlier_precision: fp16
        regular_precision: int8
      resnet-b:
        outlier_precision: fp16
        regular_precision: int8

  - from: B
    to: C
    eta_min: 0.01
    eta_max: 1.0
    allowed_methods: [topk]
    llmint8_mapping:
      resnet-a:
        outlier_precision: fp16
        regular_precision: int8
      resnet-b:
        outlier_precision: fp16
        regular_precision: int8

# Slot loop hyperparameters shared across all optimization sub-experiments.
optimization_loop:
  n_slots: 50
  batches_per_slot: 4
  profiling_batches: 4
  link_probe_interval_slots: 1
  epsilon: 0.01

metrics_server:
  host: metrics
  port: 9100
