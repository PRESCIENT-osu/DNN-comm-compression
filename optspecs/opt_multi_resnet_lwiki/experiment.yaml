# Optimization experiment spec: ResNet56 + Llama (wikitext) multi-pipeline

nodes:
  - A
  - B
  - C

pipelines:
  - name: resnet-a
    model: resnet
    partitions:
      A: [p1, p2]
      B: [p3, p4]
      C: [p5]
    flow: [A, B, C]
    simulation_path: models/resnet/resnet56-4bfd9763.th

  - name: llama-wiki-a
    model: llama
    partitions:
      A: [p1]
      B: [p2]
      C: [p3]
    flow: [A, B, C]
    simulation_path: models/llama/llama-3.1-8b

datasets:
  resnet:
    name: cifar10
    path: .datasets/cifar10
    batch_size: 100
    seed: 42
  llama:
    name: wikitext2
    path: .datasets/wikitext2
    tokenizer_path: models/llama/.partitions/tokenizer
    batch_size: 2
    max_seq_len: 256
    max_samples: 100
    seed: 42

stein_datasets:
  resnet:
    name: cifar10
    path: .datasets/cifar10
    batch_size: 10
    max_samples: 1000
    seed: 200
  llama:
    name: wikitext2
    path: .datasets/wikitext2
    tokenizer_path: models/llama/.partitions/tokenizer
    batch_size: 4
    max_seq_len: 256
    max_samples: 60
    seed: 201

workload:
  pattern: fill
  window_per_pipeline: 4
  mix:
    resnet-a: 0.5
    llama-wiki-a: 0.5

# Per-pipeline throughput targets (R_k) and WFQ compute share weights (s_comp).
tasks:
  resnet-a:
    throughput_target: 5.0   # tasks/second
    task_weight: 0.5         # proportional WFQ weight
  llama-wiki-a:
    throughput_target: 0.2
    task_weight: 0.5

links:
  - from: A
    to: B
    eta_min: 0.01
    eta_max: 1.0
    allowed_methods: [topk, quantization, llmint8]
    llmint8_mapping:
      resnet-a:
        outlier_precision: fp16
        regular_precision: int2
      llama-wiki-a:
        outlier_precision: fp16
        regular_precision: int2

  - from: B
    to: C
    eta_min: 0.01
    eta_max: 1.0
    allowed_methods: [topk, quantization, llmint8]
    llmint8_mapping:
      resnet-a:
        outlier_precision: fp16
        regular_precision: int2
      llama-wiki-a:
        outlier_precision: fp16
        regular_precision: int2

# Slot loop hyperparameters shared across all optimization sub-experiments.
optimization_loop:
  n_slots: 50
  batches_per_slot: 6
  profiling_batches: 4
  link_probe_interval_slots: 8
  epsilon: 0.1

metrics_server:
  host: metrics
  port: 9100

sub_experiments:

  - name: profiling
    type: profiling

  - name: accuracy_model_resnet-a_poly3
    type: accuracy_model
    pipeline_id: resnet-a
    model_type: poly3
    sweep_design: random
    n_sweep_samples: 1000
    dataset:
      name: cifar10
      path: .datasets/cifar10
      batch_size: 25
      max_samples: 100
      seed: 100

  - name: accuracy_model_llama-wiki-a_poly3
    type: accuracy_model
    pipeline_id: llama-wiki-a
    model_type: poly3
    sweep_design: random
    n_sweep_samples: 1000
    dataset:
      name: wikitext2
      path: .datasets/wikitext2
      tokenizer_path: models/llama/.partitions/tokenizer
      batch_size: 10
      max_seq_len: 256
      max_samples: 40
      seed: 100

  - name: max_compression_multi
    type: max_compression_multi

  - name: no_compression_multi
    type: no_compression_multi

  - name: static_equal_share
    type: static_equal_share

  - name: proportional_resource
    type: proportional_resource

  - name: strict_priority_greedy
    type: strict_priority_greedy

  - name: decoupled_descent
    type: decoupled_descent
    mu: 1.0
    epsilon: 0.1
    channel_estimator:
      type: moving_average
      window_size: 10
      warmup_value_bps: 1.0e8

  - name: queue_proportional
    type: queue_proportional
    mu: 1.0
    epsilon: 0.1
    channel_estimator:
      type: moving_average
      window_size: 10
      warmup_value_bps: 1.0e8

  - name: historical_average_ce
    type: historical_average_ce
    channel_estimator:
      type: mean
      warmup_value_bps: 1.0e8
      
  - name: csi_aware
    type: csi_aware

  - name: no_csi_am_poly3
    type: no_csi
    mu_sweep: [3.0]
    accuracy_model_refs:
      - accuracy_model_resnet-a_poly3
      - accuracy_model_llama-wiki-a_poly3
    channel_estimator:
      type: lcb
      warmup_value_bps: 1.0e8

  - name: no_csi_stein_lcb
    type: no_csi
    mu_sweep: [3.0]
    stein_config:
      sigma: 0.05
      N: 10
      n_fast_samples: 10
    channel_estimator:
      type: lcb
      warmup_value_bps: 1.0e8