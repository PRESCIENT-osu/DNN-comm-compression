sub_experiments:

  - name: profiling
    type: profiling

  - name: accuracy_model_llama
    type: accuracy_model
    pipeline_id: llama-wiki-a
    model_type: gbm
    sweep_design: random
    n_sweep_samples: 40
    dataset:
      name: wikitext2
      path: .datasets/wikitext2
      tokenizer_path: models/llama/.partitions/tokenizer
      batch_size: 2
      max_seq_len: 512
      max_samples: 40
      seed: 100

  - name: no_csi_mu_sweep
    type: no_csi
    mu_sweep: [0.5, 4.0, 10.0]
    accuracy_model_refs:
      - accuracy_model_llama
    channel_estimator:
      type: moving_average
      window_size: 10
      history_source: metrics_server
      warmup_value_bps: 1.0e8

  - name: csi_aware
    type: csi_aware

  - name: max_compression_single
    type: max_compression_single

  - name: no_compression_single
    type: no_compression_single

  - name: uniform_compression_single
    type: uniform_compression_single

  - name: myopic_single
    type: estimated_csi_single
    channel_estimator:
      type: last_observation
      warmup_value_bps: 1.0e8
