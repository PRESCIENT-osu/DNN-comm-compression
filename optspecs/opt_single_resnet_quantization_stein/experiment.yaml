# Optimization experiment spec: ResNet56 single-pipeline, quantization compression, Stein oracle.

nodes:
  - A
  - B
  - C

pipelines:
  - name: resnet-a
    model: resnet
    partitions:
      A: [p1]
      B: [p2, p3]
      C: [p4, p5]
    flow: [A, B, C]
    simulation_path: models/resnet/resnet56-4bfd9763.th

datasets:
  resnet:
    name: cifar10
    path: .datasets/cifar10
    batch_size: 100
    max_in_flight: 4
    max_samples: 10
    seed: 42

stein_datasets:
  resnet:
    name: cifar10
    path: .datasets/cifar10
    batch_size: 25
    max_samples: 60
    seed: 200

workload:
  pattern: fill
  window_per_pipeline: 4
  mix:
    resnet-a: 1.0

tasks:
  resnet-a:
    throughput_target: 5.0
    task_weight: 1.0

links:
  - from: A
    to: B
    eta_min: 0.01
    eta_max: 1.0
    allowed_methods: [quantization]

  - from: B
    to: C
    eta_min: 0.01
    eta_max: 1.0
    allowed_methods: [quantization]

optimization_loop:
  n_slots: 50
  batches_per_slot: 4
  profiling_batches: 4
  link_probe_interval_slots: 1
  epsilon: 0.01

metrics_server:
  host: metrics
  port: 9100
