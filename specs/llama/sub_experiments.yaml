sub_experiments:

  baseline_mmlu:
    dataset:
      name: mmlu
      path: models/llama/.partitions/tokenizer
      tokenizer_path: models/llama/.partitions/tokenizer
      batch_size: 4
      max_in_flight: 4
      subjects:
        - college_computer_science
        - high_school_mathematics
        - professional_law
        - global_facts
        - miscellaneous
        - business_ethics
      samples_per_subject: 50
    links:
      - from: early
        to: middle
        compression: none
      - from: middle
        to: late
        compression: none

  baseline_wikitext:
    dataset:
      name: wikitext2
      path: models/llama/.partitions/tokenizer
      tokenizer_path: models/llama/.partitions/tokenizer
      batch_size: 2
      max_in_flight: 2
      max_seq_len: 512
    links:
      - from: early
        to: middle
        compression: none
      - from: middle
        to: late
        compression: none

  topk_mmlu:
    dataset:
      name: mmlu
      path: models/llama/.partitions/tokenizer
      tokenizer_path: models/llama/.partitions/tokenizer
      batch_size: 4
      max_in_flight: 4
      subjects:
        - college_computer_science
        - high_school_mathematics
        - professional_law
        - global_facts
        - miscellaneous
        - business_ethics
      samples_per_subject: 50
    baselines:
      - sub_experiment: baseline_mmlu
      - spec: llama/single-node
        sub_experiment: baseline_mmlu
        profile: llama/single-node/default
    sweep_mode: paired
    sweep:
      - links:
          - from: early
            to: middle
            compression: topk
            rates: [0.1, 0.3, 0.5, 0.7]
          - from: middle
            to: late
            compression: topk
            rates: [0.1, 0.3, 0.5, 0.7]

  topk_wikitext:
    dataset:
      name: wikitext2
      path: models/llama/.partitions/tokenizer
      tokenizer_path: models/llama/.partitions/tokenizer
      batch_size: 2
      max_in_flight: 2
      max_seq_len: 512
    baselines:
      - sub_experiment: baseline_wikitext
      - spec: llama/single-node
        sub_experiment: baseline_wikitext
        profile: llama/single-node/default
    sweep_mode: paired
    sweep:
      - links:
          - from: early
            to: middle
            compression: topk
            rates: [0.1, 0.3, 0.5, 0.7]
          - from: middle
            to: late
            compression: topk
            rates: [0.1, 0.3, 0.5, 0.7]
